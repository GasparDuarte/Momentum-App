<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Momentum</title>
  <meta name="description" content="Your daily non-negotiables, habits, tasks and goals — in one calm place." />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#07060f" id="theme-color-meta" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Momentum" />

  <!-- Apply saved theme before paint to avoid a flash -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('momentum.v1'));
      var root = document.documentElement;
      root.dataset.theme = (s && s.settings && s.settings.theme) || 'dark';
      root.dataset.accent = (s && s.settings && s.settings.accent) || 'violet';
    } catch (e) {}
  </script>

  <!-- Fonts (graceful system fallback offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- Boot / loading splash (removed by app.js once the bar fills) -->
  <div id="boot" aria-hidden="true">
    <div class="boot__inner">
      <img class="boot__logo" src="./assets/icons/icon-192.png" alt="" width="84" height="84" />
      <div class="boot__name">MOMENTUM</div>
      <div class="boot__bar"><i></i></div>
      <div class="boot__row">
        <span class="boot__status">INITIALIZING SYSTEM</span>
        <span class="boot__pct">0%</span>
      </div>
    </div>
  </div>

  <div id="bgfx" aria-hidden="true">
    <div class="sky-layer"></div>
    <svg class="star-layer" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <circle cx="80" cy="60" r="1.4"/><circle class="c tw" cx="200" cy="120" r="1.8"/>
      <circle cx="330" cy="80" r="1"/><circle cx="450" cy="160" r="1.3"/>
      <circle class="tw" cx="560" cy="60" r="1.6"/><circle cx="640" cy="200" r="1"/>
      <circle class="c" cx="730" cy="100" r="1.4"/><circle cx="820" cy="150" r="1.1"/>
      <circle class="tw" cx="930" cy="70" r="1.7"/><circle cx="1010" cy="180" r="1.2"/>
      <circle class="c" cx="1110" cy="110" r="1.4"/><circle cx="150" cy="240" r="1"/>
      <circle class="tw" cx="380" cy="280" r="1.5"/><circle cx="520" cy="240" r="1"/>
      <circle cx="690" cy="300" r="1.1"/><circle class="c tw" cx="870" cy="250" r="1.6"/>
      <circle cx="1050" cy="300" r="1"/><circle cx="270" cy="180" r="1.2"/>
      <circle cx="960" cy="330" r="1"/><circle class="c" cx="610" cy="140" r="1.2"/>
      <circle cx="430" cy="60" r="0.9"/><circle class="tw" cx="1140" cy="240" r="1.3"/>
    </svg>
    <div class="atmosphere-layer"></div>
    <div class="celestial celestial-moon"></div>
    <div class="celestial celestial-sun"></div>
    <span class="shooting-star"></span>
    <svg class="city-far" viewBox="0 0 1200 500" preserveAspectRatio="none">
      <path d="M0 500 L0 340 L40 340 L40 280 L60 280 L60 320 L110 320 L110 230 L120 230 L125 200 L130 230 L150 230 L150 330 L210 330 L210 270 L260 270 L260 300 L320 300 L320 190 L330 190 L335 160 L340 190 L360 190 L360 310 L430 310 L430 250 L490 250 L490 290 L550 290 L550 210 L610 210 L610 280 L680 280 L680 240 L700 240 L700 300 L760 300 L760 200 L770 200 L775 170 L780 200 L800 200 L800 300 L880 300 L880 260 L950 260 L950 300 L1020 300 L1020 230 L1080 230 L1080 290 L1150 290 L1150 270 L1200 270 L1200 500 Z"/>
    </svg>
    <!-- reactor core removed for performance (its spinning rings + breathing core
         were continuous GPU animations). The sky keeps a soft horizon glow. -->

    <div class="traffic-layer">
      <span class="air-lane lane-1"></span>
      <span class="air-lane lane-2"></span>
      <span class="aircraft aircraft-1"></span>
      <span class="aircraft aircraft-2"></span>
    </div>
    <svg class="city-mid" viewBox="0 0 1200 600" preserveAspectRatio="none">
      <path class="mid" d="M0 600 L0 410 L70 410 L110 384 L150 410 L150 600 L188 600 L188 260 L210 260 L210 248 L218 248 L218 96 L226 96 L226 248 L234 248 L234 260 L256 260 L256 600 L298 600 L298 300 L360 300 L360 268 L430 268 L430 300 L470 300 L470 600 L502 600 L502 214 L560 150 L560 600 L598 600 L598 332 L664 332 L664 600 L694 600 L694 120 L713 120 L713 40 L718 0 L723 40 L723 120 L745 120 L745 600 L780 600 L780 360 L842 360 L842 316 L904 316 L904 360 L940 360 L940 600 L970 600 L970 242 L988 242 L988 214 L1016 214 L1016 242 L1034 242 L1034 600 L1066 600 L1066 300 L1089 158 L1112 300 L1112 600 L1150 600 L1150 360 L1200 360 L1200 600 Z"/>
      <g class="city-lights">
        <rect x="204" y="300" width="3" height="8"/><rect x="237" y="300" width="3" height="8"/>
        <rect x="204" y="340" width="3" height="8"/><rect x="237" y="340" width="3" height="8"/>
        <rect x="320" y="330" width="3" height="8"/><rect x="340" y="330" width="3" height="8"/>
        <rect x="400" y="332" width="3" height="8"/><rect x="420" y="360" width="3" height="8"/>
        <rect x="704" y="180" width="3" height="9"/><rect x="726" y="180" width="3" height="9"/>
        <rect x="704" y="240" width="3" height="9"/><rect x="726" y="240" width="3" height="9"/>
        <rect x="704" y="320" width="3" height="9"/><rect x="726" y="320" width="3" height="9"/>
        <rect x="800" y="400" width="3" height="8"/><rect x="858" y="400" width="3" height="8"/>
        <rect x="900" y="402" width="3" height="8"/><rect x="985" y="280" width="3" height="8"/>
        <rect x="1010" y="280" width="3" height="8"/><rect x="985" y="320" width="3" height="8"/>
      </g>
    </svg>
    <div class="city-activity">
      <span class="vertical-energy beam-a"></span>
      <span class="vertical-energy beam-b"></span>
      <span class="vertical-energy beam-c"></span>
    </div>
    <div class="city-sync-lines"></div>
    <div class="fog-layer"></div>
    <svg class="city-near" viewBox="0 0 1200 320" preserveAspectRatio="none">
      <path d="M0 320 L0 180 L90 180 L90 140 L150 140 L150 320 L210 320 L210 100 L225 100 L225 60 L233 60 L233 100 L300 100 L300 320 L380 320 L380 150 L470 150 L470 110 L540 110 L540 320 L610 320 L610 80 L625 80 L625 40 L633 40 L633 80 L700 80 L700 320 L780 320 L780 160 L880 160 L880 120 L950 120 L950 320 L1030 320 L1030 130 L1120 130 L1120 90 L1180 90 L1180 320 Z"/>
    </svg>
    <div class="discipline-field"></div>
    <div class="command-glass-layer"></div>
    <div class="console-foreground"></div>
  </div>

  <div class="app">
    <header class="appbar">
      <div class="appbar__title">
        <span class="hello" id="greeting">Hello</span>
        <span class="date" id="today-date"></span>
      </div>
      <div class="appbar__actions">
        <button class="iconbtn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme"></button>
        <button class="iconbtn" id="open-settings" aria-label="Settings" title="Settings"></button>
      </div>
    </header>

    <main class="view" id="view" role="main"></main>
  </div>

  <nav class="tabbar" aria-label="Sections">
    <div class="tabbar__inner" id="tabbar"></div>
  </nav>

  <canvas id="confetti"></canvas>
  <div id="celebrate" class="celebrate-card" aria-hidden="true"></div>

  <div id="sheet-root"></div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <!-- Classic scripts in dependency order (works when opened directly as a file) -->
  <script src="./js/utils.js"></script>
  <script src="./js/icons.js"></script>
  <script src="./js/confetti.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/components.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/interactions.js"></script>
  <script src="./js/views/home.js"></script>
  <script src="./js/views/habits.js"></script>
  <script src="./js/views/tasks.js"></script>
  <script src="./js/views/goals.js"></script>
  <script src="./js/views/stats.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
